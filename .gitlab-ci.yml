stages:
  - build
  - codestyle
  - test
  - deploy
  - notify

build:
  stage: build
  script:
    - make all
  artifacts:
    paths:
      - DO
    expire_in: 30 days

codestyle:
  stage: codestyle
  script:
    - clang-format --dry-run --Werror code-samples/main.c > clang-format-output.txt 2>&1
  artifacts:
    paths:
      - clang-format-output.txt
    expire_in: 30 days

tests:
  stage: test
  script:
    - chmod +x tests.sh && ./tests.sh

deploy:
  stage: deploy
  dependencies:
    - build
    - codestyle
    - tests
  script:
    - chmod +x deploy.sh
    - ./deploy.sh
